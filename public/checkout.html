<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BuggyShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 BuggyShop</h1>
            </div>
            <div class="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="cart.html">Carrito</a>
                <a href="profile.html">Perfil</a>
                <button id="theme-toggle">🌙</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2>Finalizar Compra</h2>

        <div class="checkout-container">
            <div class="checkout-form">
                <h3>Información de Envío</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="fullname" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" id="address" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Ciudad</label>
                            <input type="text" id="city" required>
                        </div>
                        <div class="form-group">
                            <label>Código Postal</label>
                            <input type="text" id="zipcode" required>
                        </div>
                    </div>

                    <h3>Información de Pago</h3>

                    <div class="form-group">
                        <label>Número de Tarjeta</label>
                        <input type="text" id="card-number" placeholder="1234 5678 9012 3456" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha de Expiración</label>
                            <input type="text" id="expiry" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" id="cvv" placeholder="123" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary btn-checkout-submit" id="submit-btn">
                        Realizar Pedido
                    </button>
                </form>
            </div>

            <div class="order-summary">
                <h3>Resumen del Pedido</h3>
                <div id="order-items"></div>
                <hr>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="checkout-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío:</span>
                    <span id="checkout-shipping">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Impuestos:</span>
                    <span id="checkout-taxes">$0.00</span>
                </div>
                <hr>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="checkout-total">$0.00</span>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
    <script>
        // BUG INTENCIONAL: No verifica autenticación
        function renderCheckoutSummary() {
            const cart = getCart();
            const orderItems = document.getElementById('order-items');

            if (cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }

            orderItems.innerHTML = cart.map(item => `
        <div class="order-item">
          <span>${item.name} x${item.quantity}</span>
          <span>$${(item.price * item.quantity).toFixed(2)}</span>
        </div>
      `).join('');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 100 ? 0 : 15;
            const taxes = subtotal * 0.16;
            const total = subtotal + shipping + taxes;

            document.getElementById('checkout-subtotal').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('checkout-shipping').textContent = '$' + shipping.toFixed(2);
            document.getElementById('checkout-taxes').textContent = '$' + taxes.toFixed(2);
            document.getElementById('checkout-total').textContent = '$' + total.toFixed(2);
        }

        // BUG INTENCIONAL: Race condition en submit
        let isSubmitting = false;

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // BUG INTENCIONAL: No previene doble click correctamente
            if (isSubmitting) return;
            isSubmitting = true;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';

            const cart = getCart();
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal > 100 ? 0 : 15;
            const taxes = subtotal * 0.16;
            const total = subtotal + shipping + taxes;

            try {
                const token = localStorage.getItem('token');

                // BUG INTENCIONAL: No valida token antes de enviar
                const response = await fetch('http://localhost:3000/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify({
                        items: cart,
                        total: total
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // BUG INTENCIONAL: Simula webhook de Stripe sin verificación
                    setTimeout(() => {
                        fetch('http://localhost:3000/api/webhook/stripe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                orderId: data.order.id,
                                status: 'completed'
                            })
                        });
                    }, 1000);

                    localStorage.removeItem('cart');
                    showToast('¡Pedido realizado con éxito!');

                    setTimeout(() => {
                        window.location.href = 'profile.html';
                    }, 2000);
                } else {
                    throw new Error('Error en el pedido');
                }
            } catch (error) {
                showToast('Error al procesar el pedido');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Realizar Pedido';
                isSubmitting = false;
            }
        });

        renderCheckoutSummary();
        updateCartCount();
    </script>
</body>

</html>
