<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - BuggyShop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🛒 BuggyShop</h1>
            </div>
            <div class="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="cart.html">Carrito <span id="cart-count">0</span></a>
                <a href="profile.html" class="active">Perfil</a>
                <button id="theme-toggle">🌙</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="login-section" class="auth-section">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" onclick="showRegister()">Regístrate aquí</a></p>
        </div>

        <div id="register-section" class="auth-section" style="display: none;">
            <h2>Crear Cuenta</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" onclick="showLogin()">Inicia sesión aquí</a></p>
        </div>

        <div id="profile-section" class="profile-section" style="display: none;">
            <div class="profile-header">
                <h2>Mi Perfil</h2>
                <button onclick="logout()" class="btn-secondary">Cerrar Sesión</button>
            </div>

            <div class="profile-info">
                <h3>Información Personal</h3>
                <p><strong>Usuario:</strong> <span id="user-username"></span></p>
                <p><strong>Email:</strong> <span id="user-email"></span></p>
                <p><strong>Rol:</strong> <span id="user-role"></span></p>
            </div>

            <div id="admin-section" style="display: none;">
                <h3>Panel de Administración</h3>
                <form id="upload-form">
                    <div class="form-group">
                        <label>Subir Video de Producto</label>
                        <input type="file" id="video-file" accept="video/*" required>
                    </div>
                    <button type="submit" class="btn-primary">Subir Video</button>
                </form>
            </div>

            <div class="orders-section">
                <h3>Mis Pedidos</h3>
                <div id="orders-list"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
    <script>
        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('register-section').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
        }

        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (token && user.id) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('register-section').style.display = 'none';
                document.getElementById('profile-section').style.display = 'block';

                document.getElementById('user-username').textContent = user.username;
                document.getElementById('user-email').textContent = user.email || 'N/A';
                document.getElementById('user-role').textContent = user.role;

                if (user.role === 'admin') {
                    document.getElementById('admin-section').style.display = 'block';
                }

                loadOrders();
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('¡Bienvenido!');
                    checkAuth();
                } else {
                    showToast('Credenciales inválidas');
                }
            } catch (error) {
                showToast('Error al iniciar sesión');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Cuenta creada. Inicia sesión.');
                    showLogin();
                } else {
                    showToast('Error al crear cuenta');
                }
            } catch (error) {
                showToast('Error al registrarse');
            }
        });

        // BUG INTENCIONAL: Upload sin validación de tipo MIME
        document.getElementById('upload-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('video-file');
            const file = fileInput.files[0];

            if (!file) return;

            const formData = new FormData();
            formData.append('video', file);

            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:3000/api/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': token
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Video subido correctamente');
                    fileInput.value = '';
                } else {
                    showToast('Error al subir video');
                }
            } catch (error) {
                showToast('Error en la subida');
            }
        });

        async function loadOrders() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:3000/api/orders', {
                    headers: {
                        'Authorization': token
                    }
                });

                const orders = await response.json();
                const ordersList = document.getElementById('orders-list');

                if (orders.length === 0) {
                    ordersList.innerHTML = '<p>No tienes pedidos aún</p>';
                    return;
                }

                // BUG INTENCIONAL: Muestra TODOS los pedidos, no solo los del usuario
                ordersList.innerHTML = orders.map(order => `
          <div class="order-card">
            <h4>Pedido #${order.id}</h4>
            <p>Estado: ${order.status}</p>
            <p>Total: $${order.total.toFixed(2)}</p>
            <p>Fecha: ${new Date(order.createdAt).toLocaleDateString()}</p>
          </div>
        `).join('');
            } catch (error) {
                console.error('Error cargando pedidos:', error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            showToast('Sesión cerrada');
            window.location.reload();
        }

        checkAuth();
        updateCartCount();
    </script>
</body>

</html>
